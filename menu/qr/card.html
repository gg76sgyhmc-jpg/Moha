<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بطاقة الباركود — أسطا غازي</title>
<style>
/* A table card for the QR that opens the menu. Laid out at A6 (105×148mm),
   four to an A4 sheet if you print at 100% and cut. Colours are the menu's
   own red and gold. */
@page { size: A6; margin: 0; }

:root {
  --red-900: #5E0A10;
  --red-700: #A6141C;
  --gold:    #F2B705;
  --char:    #101010;
  --cream:   #FBF5EC;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  display: grid;
  place-items: center;
  min-height: 100vh;
  background: #2A2624;
  font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
}

.card {
  width: 105mm; height: 148mm;
  background: radial-gradient(120% 80% at 50% 0%, var(--red-700) 0%, var(--red-900) 100%);
  color: var(--cream);
  display: flex; flex-direction: column; align-items: center;
  padding: 10mm 8mm;
  text-align: center;
}

.card__band {
  background: var(--char); color: var(--gold);
  font-weight: 900; font-size: 5mm; letter-spacing: .01em;
  padding: 2.4mm 6mm; border-radius: 999px;
}

.logo { width: 23mm; margin: 5mm auto 2.5mm; }

.card h1 { margin: 0; font-size: 8.4mm; font-weight: 900; line-height: 1.05; }
.card h2 {
  margin: 1.5mm 0 0; font-size: 3.4mm; font-weight: 700;
  letter-spacing: .38em; padding-inline-start: .38em;
  direction: ltr; color: var(--gold);
}

.qr {
  margin-top: auto;
  background: var(--cream);
  padding: 3.5mm; border-radius: 4mm;
  box-shadow: 0 3mm 8mm rgba(0, 0, 0, .3);
}
.qr img { display: block; width: 43mm; height: 43mm; }

.cta { margin-top: 4mm; font-size: 4.4mm; font-weight: 700; }
.cta small {
  display: block; margin-top: 1mm;
  font-size: 2.9mm; font-weight: 400; letter-spacing: .16em;
  color: rgba(251, 245, 236, .6); direction: ltr;
}

.foot {
  margin-top: 3.5mm;
  font-size: 2.8mm; font-weight: 400; color: rgba(251, 245, 236, .55);
  direction: ltr;
}

@media print {
  body { background: #fff; min-height: 0; display: block; }
  .card { width: 105mm; height: 148mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>

<body>
<div class="card">
  <span class="card__band">شاورما على الفحم</span>

  <img class="logo" src="../logo.png" alt="أسطا غازي">
  <h1>أسطا غازي</h1>
  <h2>SHAWARMA</h2>

  <div class="qr">
    <img src="menu-qr.png" alt="امسح الرمز لعرض المنيو">
  </div>

  <p class="cta">
    امسح الرمز لعرض المنيو
    <small>SCAN FOR THE MENU</small>
  </p>

  <p class="foot">gg76sgyhmc-jpg.github.io/Moha/usta-ghazi/menu.pdf</p>
</div>
</body>
</html>
