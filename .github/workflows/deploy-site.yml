name: Publish to GitHub Pages

# Pages here serves the `gh-pages` branch (classic branch source), which GitHub
# enabled by itself when that branch first appeared. The Actions source was not
# an option: turning Pages on through actions/configure-pages needs a token with
# repository admin, which GITHUB_TOKEN is not.
#
# So this job stages the public files and force-pushes them to gh-pages as a
# single commit. Nothing is compiled — the sites are static, and their assets
# are referenced relatively, so they work unchanged under the /Moha/ subpath.

on:
  push:
    branches:
      - main
      - claude/install-ui-ux-pro-max-skill-f57b42
    paths:
      - 'raham/**'
      - 'site/**'
      - 'menu/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Stage the public files
        run: |
          set -euo pipefail
          rm -rf _deploy
          mkdir -p _deploy/elegance

          # Raham sits at the root; the salon site alongside it.
          cp raham/index.html raham/raham-one-file.html _deploy/
          cp -r raham/assets _deploy/assets
          cp site/index.html site/standalone.html _deploy/elegance/
          cp -r site/assets _deploy/elegance/assets

          # The Usta Ghazi menu, at the address its QR code points to.
          mkdir -p _deploy/usta-ghazi
          cp menu/usta-ghazi-menu.pdf _deploy/usta-ghazi/menu.pdf
          cp menu/index.html _deploy/usta-ghazi/index.html
          cp menu/qr/menu-qr.png menu/qr/menu-qr.svg _deploy/usta-ghazi/

          # Without this Pages runs Jekyll, which drops underscore-prefixed paths.
          touch _deploy/.nojekyll
          # Any unknown URL lands on the links page rather than a GitHub 404.
          cp raham/index.html _deploy/404.html
          du -sh _deploy

      - name: Push to gh-pages
        run: |
          set -euo pipefail
          cd _deploy
          git init -q .
          git checkout -q -b gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          # A single-commit force push: this branch is build output, so its
          # history is noise and would grow without bound.
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
