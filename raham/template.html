<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قهوة رهم — Raham Coffee</title>
<meta name="description" content="قهوة رهم | Raham Coffee — الخبر. المنيو، إنستقرام، تيك توك، سناب شات، التوصيل، والموقع.">
<meta name="theme-color" content="#151D15">
<meta property="og:title" content="قهوة رهم — Raham Coffee">
<meta property="og:description" content="كل روابط رهم في مكان واحد">
<meta property="og:type" content="website">
<style>
/*@FONTS@*/

/* ══════════════════════════════════════════════════════════════════════
   Raham Coffee — one page, two views

   Both views run cream on the café's own deep green: #151D15, sampled from
   the artwork the owner supplied (98.9% of that file's pixels), with the
   cream at #F3F0D7 taken from the same file. The sage #A3AE84 that carried
   the earlier version is the logo's own green and stays on as the accent.
   This is the palette of their printed menu boards, not an interpretation
   of them.

   The links view and the menu live in the same document and swap on the URL
   hash, so tapping المنيو never leaves the page and back still works.
   ══════════════════════════════════════════════════════════════════════ */
:root {
  --ink-950: #0D130D;
  --ink-900: #151D15;   /* the ground */
  --ink-850: #182117;
  --ink-800: #1D2719;
  --ink-700: #27331F;

  --sage:     #A3AE84;
  --sage-dim: #7C8A5F;

  --cream:   #F3F0D7;
  --cream-2: rgba(243, 240, 215, .66);
  --cream-3: rgba(243, 240, 215, .42);
  --hair:    rgba(243, 240, 215, .13);
  --hair-2:  rgba(243, 240, 215, .26);

  --ff: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;

  /* One easing family, so nothing on the page moves to a different rhythm. */
  --ease:   cubic-bezier(.22, .61, .36, 1);
  --spring: cubic-bezier(.34, 1.32, .48, 1);
  --dur:    260ms;
  --head-h: 60px;
}

*, *::before, *::after { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
  scroll-padding-top: calc(var(--head-h) + 60px);
  background: var(--ink-900);
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: var(--ff);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.7;
  color: var(--cream-2);
  background: var(--ink-900);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.3; color: var(--cream); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; border-radius: 6px; }

.wrap { width: min(100% - 36px, 900px); margin-inline: auto; }
.wrap--narrow { width: min(100% - 36px, 520px); margin-inline: auto; }

/* ═══════════ VIEW SWITCH ═══════════ */
.view { display: none; }
.view.is-on { display: block; }
.links-view.is-on { display: flex; }

/* Without JavaScript the hash alone opens the menu. */
#menu:target { display: block; }
body:has(#menu:target) #view-links { display: none; }

/* Where the View Transitions API exists the swap is a real cross-fade of the
   two DOM states; this is the fallback for everywhere else. */
.view.is-on { animation: viewIn .42s var(--ease) both; }
@keyframes viewIn {
  from { opacity: 0; transform: translateY(10px) scale(.994); }
}
::view-transition-old(root) { animation: vtOut .3s var(--ease) both; }
::view-transition-new(root) { animation: vtIn .42s var(--ease) both; }
@keyframes vtOut { to { opacity: 0; transform: scale(.99); } }
@keyframes vtIn { from { opacity: 0; transform: scale(1.008); } }

/* ═════════════════════════════════════════════════════════
   VIEW 1 — LINKS
   ═════════════════════════════════════════════════════════ */
.links-view { min-height: 100dvh; flex-direction: column; position: relative; overflow: hidden; }

/* A slow breathing glow behind the mark — the only ambient motion on the
   page, and the reason the flat green reads as a lit room. */
.glow {
  position: absolute; inset-block-start: -18%; inset-inline: 0;
  height: 62vh; pointer-events: none; z-index: 0;
  background: radial-gradient(50% 50% at 50% 40%,
              rgba(163, 174, 132, .17) 0%, rgba(163, 174, 132, .05) 45%, transparent 72%);
  animation: breathe 11s var(--ease) infinite;
}
@keyframes breathe {
  0%, 100% { opacity: .75; transform: scale(1); }
  50%      { opacity: 1;   transform: scale(1.09); }
}

.top { padding-block: var(--sp-8) var(--sp-6); text-align: center; position: relative; z-index: 1; }

.logo { width: 176px; margin-inline: auto; margin-block-end: var(--sp-5); }

.name { font-size: clamp(26px, 6.4vw, 34px); letter-spacing: -.01em; }
.name-en {
  margin-top: var(--sp-2);
  font-size: 12px; font-weight: 500;
  letter-spacing: .34em;
  padding-inline-start: .34em;   /* offsets the trailing track, keeps it centred */
  direction: ltr;
  color: var(--sage);
}

.meta { margin-top: var(--sp-5); display: flex; flex-wrap: wrap; justify-content: center; gap: var(--sp-2) var(--sp-3); }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--hair); border-radius: var(--r-full);
  padding: 6px 14px; font-size: 13px; font-weight: 300;
  color: var(--cream-2);
}
.pill svg { flex: none; color: var(--sage); }
.pill b { color: var(--cream); font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }

.links { display: flex; flex-direction: column; gap: var(--sp-3); padding-block-end: var(--sp-7); position: relative; z-index: 1; }

.row {
  position: relative; overflow: hidden;
  display: flex; align-items: center; gap: var(--sp-4);
  width: 100%; min-height: 74px;
  padding: var(--sp-3) var(--sp-4);
  background: var(--ink-800);
  border: 1px solid var(--hair);
  border-radius: var(--r-lg);
  color: var(--cream);
  text-align: start;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              transform 220ms var(--spring), box-shadow var(--dur) var(--ease);
}
.row:hover, .row:focus-visible {
  background: var(--ink-700);
  border-color: var(--hair-2);
  transform: translateY(-3px);
  box-shadow: 0 10px 26px rgba(0, 0, 0, .3);
}
/* Tactile press: the row gives, then springs back. */
.row:active { transform: translateY(-1px) scale(.988); transition-duration: 90ms; }

/* A light sweeps across on hover, once, in the reading direction. */
.row::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(100deg, transparent 20%, rgba(243,240,215,.10) 48%, transparent 74%);
  transform: translateX(-120%);
}
.row:hover::after { animation: sweep .85s var(--ease); }
@keyframes sweep { to { transform: translateX(120%); } }

/* The menu is why most people open this page: the one filled row. */
.row--featured { background: var(--cream); border-color: var(--cream); color: var(--ink-900); }
.row--featured:hover, .row--featured:focus-visible { background: #FBF9E9; border-color: #FBF9E9; }
.row--featured .row__ic { background: rgba(21, 29, 21, .1); color: var(--ink-900); }
.row--featured .row__sub { color: rgba(21, 29, 21, .6); }
.row--featured .row__go { color: rgba(21, 29, 21, .45); }
.row--featured::after { background: linear-gradient(100deg, transparent 20%, rgba(21,29,21,.06) 48%, transparent 74%); }

.row__ic {
  flex: none; width: 46px; height: 46px; border-radius: var(--r-md);
  background: rgba(243, 240, 215, .08);
  display: grid; place-items: center; color: var(--sage);
  transition: transform 220ms var(--spring), background var(--dur) var(--ease);
}
.row:hover .row__ic { transform: scale(1.08) rotate(-3deg); }
.row__txt { flex: 1; min-width: 0; }
.row__label { display: block; font-size: 16.5px; font-weight: 500; line-height: 1.35; }
.row__sub {
  display: block; font-size: 13px; font-weight: 300; color: var(--cream-3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row__go { flex: none; color: var(--cream-3); transition: transform 220ms var(--spring); }
.row:hover .row__go { transform: translateX(-5px); }   /* RTL: forward is leftward */

.foot-links {
  margin-top: auto; padding-block: var(--sp-5) var(--sp-6);
  text-align: center; font-size: 12px; font-weight: 300; color: var(--cream-3);
  position: relative; z-index: 1;
}
.foot-links p + p { margin-top: 4px; }

/* ═══════════ ENTRANCE ═══════════
   One cascade on load: mark, name, meta, then the rows in sequence. */
.rise { opacity: 0; animation: rise .72s var(--ease) forwards; }
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

/* The mark arrives on its own terms — a slow settle, not a slide. */
.logo.rise { animation: mark 1.1s var(--ease) forwards; }
@keyframes mark {
  from { opacity: 0; transform: translateY(10px) scale(.94); filter: blur(6px); }
  to   { opacity: 1; transform: none; filter: none; }
}

/* ═════════════════════════════════════════════════════════
   VIEW 2 — MENU
   ═════════════════════════════════════════════════════════ */
.hdr {
  position: sticky; inset-block-start: 0; z-index: 40;
  height: var(--head-h); display: flex; align-items: center;
  background: rgba(21, 29, 21, .82);
  backdrop-filter: blur(14px) saturate(1.3);
  border-block-end: 1px solid var(--hair);
}
.hdr__in { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.hdr__logo { display: flex; align-items: center; gap: var(--sp-3); }
.hdr__logo img { height: 30px; width: auto; }
.hdr__logo b { font-size: 15px; font-weight: 700; color: var(--cream); }

.back {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 0 var(--sp-4);
  border: 1px solid var(--hair); border-radius: var(--r-full);
  font-size: 13.5px; font-weight: 500; color: var(--cream-2);
  background: transparent;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              color var(--dur) var(--ease);
}
.back:hover { background: var(--ink-800); border-color: var(--hair-2); color: var(--cream); }
.back svg { transition: transform 220ms var(--spring); }
.back:hover svg { transform: translateX(4px); }

.hero { padding-block: var(--sp-7) var(--sp-6); text-align: center; }
.hero__mark { width: 132px; margin-inline: auto; margin-block-end: var(--sp-4); }
.hero h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -.01em; }
.hero__en {
  margin-top: 6px; font-size: 11.5px; font-weight: 500; letter-spacing: .3em;
  direction: ltr; color: var(--sage);
}
.hero p { margin-top: var(--sp-3); font-size: 14.5px; color: var(--cream-3); max-width: 46ch; margin-inline: auto; }

.jump {
  position: sticky; inset-block-start: var(--head-h); z-index: 30;
  background: rgba(21, 29, 21, .88);
  backdrop-filter: blur(14px);
  border-block-end: 1px solid var(--hair);
  padding-block: var(--sp-3);
}
.jump__in { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; }
.jump__in::-webkit-scrollbar { display: none; }
.jump a {
  flex: none; display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 42px; padding: 0 var(--sp-5);
  border: 1px solid var(--hair); border-radius: var(--r-full);
  font-size: 14.5px; font-weight: 500; color: var(--cream-2);
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
              border-color var(--dur) var(--ease), transform 200ms var(--spring);
}
.jump a:hover { border-color: var(--hair-2); color: var(--cream); }
.jump a.is-active { background: var(--sage); border-color: var(--sage); color: var(--ink-900); }
.jump a:active { transform: scale(.96); }
.jump a span { font-size: 12px; opacity: .7; font-variant-numeric: lining-nums tabular-nums; }

.sec { padding-block: var(--sp-7); }
.sec + .sec { border-block-start: 1px solid var(--hair); }

.sec__head { display: flex; align-items: baseline; gap: var(--sp-3); margin-block-end: var(--sp-5); }
.sec__head h2 { font-size: clamp(22px, 4.4vw, 30px); }
.sec__head .en {
  font-size: 12px; font-weight: 500; letter-spacing: .26em;
  direction: ltr; color: var(--sage);
}
.sec__rule { flex: 1; height: 1px; background: var(--hair); }
.sec__n { font-size: 13px; font-weight: 500; color: var(--cream-3); font-variant-numeric: lining-nums tabular-nums; }

.grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } }

.item {
  display: flex; gap: var(--sp-4); align-items: stretch;
  background: var(--ink-850);
  border: 1px solid var(--hair);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease),
              transform 240ms var(--spring), box-shadow var(--dur) var(--ease);
}
.item:hover {
  background: var(--ink-800); border-color: var(--hair-2);
  transform: translateY(-3px);
  box-shadow: 0 10px 28px rgba(0, 0, 0, .32);
}

.item__media { flex: none; width: 92px; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--ink-800); }
.item__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 700ms var(--ease); }
.item:hover .item__media img { transform: scale(1.09); }

/* No photo on file. A coffee cup here would mislabel a dessert, and a grey
   box reads as broken, so the tile carries the café's own mark instead —
   honest about the gap and still theirs. */
.item__media--none {
  width: 100%; height: 100%; display: grid; place-items: center;
  background: linear-gradient(155deg, var(--ink-700) 0%, var(--ink-850) 100%);
  border: 1px solid var(--hair);
  border-radius: inherit;
}
.item__media--none img { width: 62%; height: auto; opacity: .45; }

.item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.item__name { font-size: 16px; font-weight: 700; line-height: 1.4; }
.item__en {
  font-size: 12px; font-weight: 400; color: var(--sage);
  direction: ltr; text-align: right; letter-spacing: .02em;
}
.item__desc {
  margin-top: 3px;
  font-size: 12.5px; font-weight: 300; color: var(--cream-3); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item__foot { margin-top: auto; padding-top: var(--sp-3); display: flex; align-items: baseline; gap: var(--sp-3); }
.item__price { font-size: 19px; font-weight: 700; color: var(--cream); font-variant-numeric: lining-nums tabular-nums; }
.item__price small { font-size: 11px; font-weight: 500; color: var(--sage); margin-inline-start: 3px; }
.item__cal { font-size: 11.5px; font-weight: 300; color: var(--cream-3); font-variant-numeric: lining-nums tabular-nums; }

.foot-menu {
  border-block-start: 1px solid var(--hair);
  padding-block: var(--sp-7); margin-block-start: var(--sp-6);
  text-align: center; background: var(--ink-950);
}
.foot-menu img { width: 112px; margin-inline: auto; margin-block-end: var(--sp-4); }
.foot-menu p { font-size: 13px; font-weight: 300; color: var(--cream-3); }
.foot-menu .btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 48px; padding: 0 var(--sp-6); margin-block-start: var(--sp-5);
  background: var(--cream); color: var(--ink-900);
  border-radius: var(--r-full); font-size: 15px; font-weight: 500;
  transition: transform 220ms var(--spring), background var(--dur) var(--ease),
              box-shadow var(--dur) var(--ease);
}
.foot-menu .btn:hover { background: #FBF9E9; transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.34); }
.foot-menu .btn:active { transform: translateY(-1px) scale(.98); }
.foot-menu__note { margin-block-start: var(--sp-5); font-size: 11.5px; color: var(--cream-3); opacity: .7; }

/* ═══════════ SCROLL REVEAL ═══════════
   Where the browser supports scroll-driven animations the reveal runs on the
   compositor, off the main thread, so it stays smooth while scrolling fast.
   Everything else falls back to an IntersectionObserver that adds .is-in. */
.rv { opacity: 0; transform: translateY(18px); transition: opacity .62s var(--ease), transform .62s var(--ease); }
.rv.is-in { opacity: 1; transform: none; }

@supports (animation-timeline: view()) {
  .rv {
    opacity: 1; transform: none; transition: none;
    animation: rvIn linear both;
    animation-timeline: view();
    animation-range: entry 0% entry 46%;
  }
  .rv.is-in { animation: rvIn linear both; }
}
@keyframes rvIn { from { opacity: 0; transform: translateY(18px); } }

@media (prefers-reduced-motion: reduce) {
  .rise, .logo.rise, .view.is-on { animation: none; opacity: 1; transform: none; }
  .rv { opacity: 1; transform: none; transition: none; animation: none; }
  .glow { animation: none; }
  .row::after { display: none; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .row:hover, .item:hover, .foot-menu .btn:hover { transform: none; }
  .item:hover .item__media img, .row:hover .row__ic, .row:hover .row__go { transform: none; }
  ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
}
</style>
</head>

<body>

<!-- ═══════════ VIEW 1 — LINKS ═══════════ -->
<div class="view links-view is-on" id="view-links">
  <div class="glow" aria-hidden="true"></div>

  <main class="wrap--narrow">
    <header class="top">
      <img class="logo rise" src="assets/logo-mark.webp" alt="قهوة رهم" width="176" height="98" style="animation-delay:.06s">
      <h1 class="name rise" style="animation-delay:.30s">قهوة رهم</h1>
      <p class="name-en rise" style="animation-delay:.36s">RAHAM COFFEE</p>

      <div class="meta rise" style="animation-delay:.42s">
        <!--@META@-->
      </div>
    </header>

    <nav class="links" aria-label="روابط قهوة رهم">
      <!--@LINKS@-->
    </nav>
  </main>

  <footer class="foot-links">
    <p>قهوة رهم · الخبر</p>
    <p><span dir="ltr">© <span class="yr">2026</span> Raham Coffee</span></p>
  </footer>
</div>

<!-- ═══════════ VIEW 2 — MENU ═══════════ -->
<div class="view" id="menu">
  <header class="hdr">
    <div class="wrap hdr__in">
      <a class="hdr__logo" href="#">
        <img src="assets/logo-mark.webp" alt="قهوة رهم" width="54" height="30">
        <b>قهوة رهم</b>
      </a>
      <a class="back" href="#">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        العودة
      </a>
    </div>
  </header>

  <main>
    <section class="wrap hero">
      <img class="hero__mark" src="assets/logo-mark.webp" alt="قهوة رهم" width="132" height="73">
      <h1>المنيو</h1>
      <p class="hero__en">MENU</p>
      <p>@N_ITEMS@ صنفاً — الأسعار بالريال السعودي.</p>
    </section>

    <nav class="jump" aria-label="أقسام المنيو">
      <div class="wrap jump__in">
        <!--@JUMP@-->
      </div>
    </nav>

    <div class="wrap">
      <!--@SECTIONS@-->
    </div>
  </main>

  <footer class="foot-menu">
    <img src="assets/logo-mark.webp" alt="قهوة رهم" width="112" height="62">
    <p>قهوة رهم · الخبر</p>
    <a class="btn" href="@DELIVERY@" target="_blank" rel="noopener">
      اطلب توصيل
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17V6a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v11h13Z"/><path d="M14 9h3.5a1 1 0 0 1 .8.4l2.5 3.3a1 1 0 0 1 .2.6V17h-7V9Z"/><circle cx="6" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/></svg>
    </a>
    <p class="foot-menu__note">أسعار المنيو داخل الكوفي. أسعار التوصيل تختلف.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  [].forEach.call(document.querySelectorAll('.yr'), function (el) {
    el.textContent = new Date().getFullYear();
  });

  var views = { links: document.getElementById('view-links'),
                menu:  document.getElementById('menu') };
  var themeMeta = document.querySelector('meta[name="theme-color"]');
  var revealed = false;

  function paint(isMenu) {
    views.links.classList.toggle('is-on', !isMenu);
    views.menu.classList.toggle('is-on', isMenu);
    document.title = isMenu ? 'منيو قهوة رهم — Raham Coffee' : 'قهوة رهم — Raham Coffee';
    themeMeta.setAttribute('content', '#151D15');
    window.scrollTo(0, 0);
    if (isMenu) reveal();
  }

  /* The hash is the router: "#menu" opens the menu, empty goes home. Any
     other hash is a section anchor inside the menu, and must not be read as
     "leave the menu" — that is what used to bounce a category tap home. */
  function show(name, push) {
    var isMenu = name === 'menu';
    if (push) {
      history.pushState(null, '', isMenu ? '#menu' : location.pathname + location.search);
    }
    // A real cross-fade between the two DOM states where the browser has it.
    if (!reduce && document.startViewTransition) {
      document.startViewTransition(function () { paint(isMenu); });
    } else {
      paint(isMenu);
    }
  }

  function fromHash() {
    var h = location.hash;
    if (h === '#menu') return paint(true);
    if (!h) return paint(false);
    var id = h.slice(1);
    try { id = decodeURIComponent(id); } catch (e) {}
    if (views.menu.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]')) {
      if (!views.menu.classList.contains('is-on')) paint(true);
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href="#menu"], a[href="#"]');
    if (!a) return;
    e.preventDefault();
    show(a.getAttribute('href') === '#menu' ? 'menu' : 'links', true);
  });

  addEventListener('popstate', fromHash);
  fromHash();

  /* Card reveals and the active-category indicator. Both are wired only once
     the menu has actually been shown — an observer against a hidden view
     reports nothing intersecting and would mark everything revealed. */
  function reveal() {
    if (revealed) return;
    revealed = true;

    var scrollDriven = CSS.supports && CSS.supports('animation-timeline: view()');
    if (!scrollDriven) {
      var rv = [].slice.call(views.menu.querySelectorAll('.rv'));
      if (reduce || !('IntersectionObserver' in window)) {
        rv.forEach(function (el) { el.classList.add('is-in'); });
      } else {
        var io = new IntersectionObserver(function (es) {
          es.forEach(function (e, i) {
            if (!e.isIntersecting) return;
            var el = e.target;
            setTimeout(function () { el.classList.add('is-in'); }, Math.min(i, 6) * 55);
            io.unobserve(el);
          });
        }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
        rv.forEach(function (el) { io.observe(el); });
      }
    }

    var links = [].slice.call(views.menu.querySelectorAll('.jump a'));
    var secs = links.map(function (a) {
      var id = a.getAttribute('href').slice(1);
      try { id = decodeURIComponent(id); } catch (e) {}
      return views.menu.querySelector('[id="' + (window.CSS && CSS.escape ? CSS.escape(id) : id) + '"]');
    });
    if (!('IntersectionObserver' in window)) return;
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var i = secs.indexOf(e.target);
        links.forEach(function (a, j) { a.classList.toggle('is-active', i === j); });
      });
    }, { rootMargin: '-28% 0px -62% 0px' });
    secs.forEach(function (s) { if (s) spy.observe(s); });
    if (links[0]) links[0].classList.add('is-active');
  }
})();
</script>
</body>
</html>
