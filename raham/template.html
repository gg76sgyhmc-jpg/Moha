<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>قهوة رهم — Raham Coffee</title>
<meta name="description" content="قهوة رهم | Raham Coffee — الخبر. المنيو، إنستقرام، تيك توك، سناب شات، التوصيل، والموقع.">
<meta name="theme-color" id="tc" content="#7C8A5F">
<meta property="og:title" content="قهوة رهم — Raham Coffee">
<meta property="og:description" content="كل روابط رهم في مكان واحد">
<meta property="og:type" content="website">
<style>
/*@FONTS@*/

/* ══════════════════════════════════════════════════════════════════════
   Raham Coffee — one page, two views

   The links view and the menu live in the same document and swap on the
   URL hash, so tapping المنيو never leaves the page and the back button
   still works.

   The palette is lifted from the café's own material: --sage is the exact
   green behind the logo's calligraphy (#A3AE84, 70% of that file's
   pixels), --cream is the ink of the same calligraphy (#F3EEC6), and the
   browns are quantised from their cup photograph. The links view runs
   cream-on-sage, the logo's own figure/ground; the menu inverts to cream
   paper, because photographs and prices need the quieter surface.
   ══════════════════════════════════════════════════════════════════════ */
:root {
  --sage:        #A3AE84;
  --sage-deep:   #7C8A5F;
  --sage-dark:   #5A6644;
  --sage-ink:    #3A4230;

  --cream:       #F3EEC6;
  --cream-soft:  #FBF8EC;
  --paper:       #FBF8EC;
  --paper-2:     #F4EFDF;

  --coffee:      #4F3629;
  --coffee-mid:  #8E705E;
  --taupe:       #C5AC9D;

  --ink:         #2A2620;
  --ink-2:       #5C544A;
  --muted:       #8B8175;
  --line:        #E6DFC9;

  --ff: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --dur: 240ms;
  --head-h: 60px;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head-h) + 58px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: var(--ff);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;

  /* The ground follows the active view, so over-scroll never exposes the
     other view's colour. A soft wash sized to the whole body rather than
     fixed to the viewport — fixed attachment stops at the fold and costs
     repaints on mobile Safari. */
  color: var(--cream);
  background-color: var(--sage-deep);
  background-image:
    radial-gradient(120% 70% at 50% -10%, var(--sage) 0%, var(--sage-deep) 52%, var(--sage-dark) 100%);
  background-repeat: no-repeat;
  background-size: 100% 100%;
  transition: background-color var(--dur) var(--ease);
}
body.on-menu {
  color: var(--ink-2);
  background-color: var(--paper);
  background-image: none;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.3; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible { outline: 2px solid currentColor; outline-offset: 3px; border-radius: 6px; }

.wrap { width: min(100% - 36px, 900px); margin-inline: auto; }
.wrap--narrow { width: min(100% - 36px, 520px); margin-inline: auto; }

/* ═══════════ VIEW SWITCH ═══════════ */
.view { display: none; }
.view.is-on { display: block; animation: fade .34s var(--ease); }

/* Without JavaScript the hash still opens the menu: :target does the same
   job the router does, and both agree because the router pushes the hash. */
#menu:target { display: block; }
body:has(#menu:target) #view-links { display: none; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }

/* ═════════════════════════════════════════════════════════
   VIEW 1 — LINKS
   ═════════════════════════════════════════════════════════ */
.links-view.is-on { display: flex; }
.links-view { min-height: 100dvh; flex-direction: column; }

.top { padding-block: var(--sp-8) var(--sp-6); text-align: center; }

.logo {
  width: 168px; margin-inline: auto; margin-block-end: var(--sp-5);
  filter: drop-shadow(0 6px 18px rgba(58,66,48,.32));
}

.name { font-size: clamp(26px, 6.4vw, 34px); letter-spacing: -.01em; color: var(--cream); }
.name-en {
  margin-top: var(--sp-2);
  font-size: 12px; font-weight: 500;
  letter-spacing: .34em;
  padding-inline-start: .34em;   /* offsets the trailing track, keeps it centred */
  direction: ltr;
  color: rgba(243,238,198,.62);
}

.meta {
  margin-top: var(--sp-5);
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: var(--sp-2) var(--sp-3);
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid rgba(243,238,198,.26);
  border-radius: var(--r-full);
  padding: 6px 14px;
  font-size: 13px; font-weight: 300;
  color: rgba(243,238,198,.9);
}
.pill svg { flex: none; opacity: .85; }
.pill b { font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }

.links { display: flex; flex-direction: column; gap: var(--sp-3); padding-block-end: var(--sp-7); }

.row {
  display: flex; align-items: center; gap: var(--sp-4);
  width: 100%; min-height: 72px;
  padding: var(--sp-3) var(--sp-4);
  background: rgba(251,248,236,.1);
  border: 1px solid rgba(243,238,198,.2);
  border-radius: var(--r-lg);
  backdrop-filter: blur(6px);
  color: var(--cream);
  text-align: start;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              transform var(--dur) var(--ease);
}
.row:hover, .row:focus-visible {
  background: rgba(251,248,236,.17);
  border-color: rgba(243,238,198,.42);
  transform: translateY(-2px);
}
.row:active { transform: translateY(0); }

/* The menu is why most people open this page, so it is the one filled row
   rather than a seventh outline. */
.row--featured { background: var(--cream); border-color: var(--cream); color: var(--sage-ink); }
.row--featured:hover, .row--featured:focus-visible { background: var(--cream-soft); border-color: var(--cream-soft); }
.row--featured .row__ic { background: rgba(58,66,48,.1); color: var(--sage-ink); }
.row--featured .row__sub { color: rgba(58,66,48,.66); }
.row--featured .row__go { color: rgba(58,66,48,.5); }

.row__ic {
  flex: none;
  width: 46px; height: 46px; border-radius: var(--r-md);
  background: rgba(243,238,198,.14);
  display: grid; place-items: center;
  color: var(--cream);
}
.row__txt { flex: 1; min-width: 0; }
.row__label { display: block; font-size: 16.5px; font-weight: 500; line-height: 1.35; }
.row__sub {
  display: block;
  font-size: 13px; font-weight: 300; color: rgba(243,238,198,.62);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row__go { flex: none; color: rgba(243,238,198,.45); transition: transform var(--dur) var(--ease); }
.row:hover .row__go { transform: translateX(-4px); }   /* RTL: forward is leftward */

.foot-links {
  margin-top: auto;
  padding-block: var(--sp-5) var(--sp-6);
  text-align: center;
  font-size: 12px; font-weight: 300;
  color: rgba(243,238,198,.45);
}
.foot-links p + p { margin-top: 4px; }

.rise { opacity: 0; transform: translateY(14px); animation: rise .6s var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

/* ═════════════════════════════════════════════════════════
   VIEW 2 — MENU
   ═════════════════════════════════════════════════════════ */
.menu-view { color: var(--ink-2); }
.menu-view h1, .menu-view h2, .menu-view h3 { color: var(--ink); }

.hdr {
  position: sticky; inset-block-start: 0; z-index: 40;
  height: var(--head-h);
  display: flex; align-items: center;
  background: rgba(251,248,236,.9);
  backdrop-filter: blur(12px) saturate(1.3);
  border-block-end: 1px solid var(--line);
}
.hdr__in { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.hdr__logo { display: flex; align-items: center; gap: var(--sp-3); }
.hdr__logo img { height: 34px; width: auto; border-radius: 7px; }
.hdr__logo b { font-size: 15px; font-weight: 700; color: var(--ink); }

.back {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 0 var(--sp-4);
  border: 1px solid var(--line); border-radius: var(--r-full);
  font-size: 13.5px; font-weight: 500; color: var(--sage-dark);
  background: transparent;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.back:hover { background: var(--paper-2); border-color: var(--sage); }

.hero { padding-block: var(--sp-7) var(--sp-6); text-align: center; }
.hero__mark { width: 128px; margin-inline: auto; margin-block-end: var(--sp-4); border-radius: 12px; }
.hero h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -.01em; }
.hero p { margin-top: var(--sp-3); font-size: 15px; color: var(--muted); max-width: 46ch; margin-inline: auto; }

.jump {
  position: sticky; inset-block-start: var(--head-h); z-index: 30;
  background: rgba(251,248,236,.92);
  backdrop-filter: blur(12px);
  border-block-end: 1px solid var(--line);
  padding-block: var(--sp-3);
}
.jump__in { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; }
.jump__in::-webkit-scrollbar { display: none; }
.jump a {
  flex: none;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 42px; padding: 0 var(--sp-5);
  border: 1px solid var(--line); border-radius: var(--r-full);
  font-size: 14.5px; font-weight: 500; color: var(--ink-2);
  background: var(--paper);
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
              border-color var(--dur) var(--ease);
}
.jump a:hover, .jump a.is-active { background: var(--sage-deep); border-color: var(--sage-deep); color: var(--paper); }
.jump a span { font-size: 12px; opacity: .66; font-variant-numeric: lining-nums tabular-nums; }

.sec { padding-block: var(--sp-7); }
.sec + .sec { border-block-start: 1px solid var(--line); }

.sec__head { display: flex; align-items: baseline; gap: var(--sp-3); margin-block-end: var(--sp-5); }
.sec__head h2 { font-size: clamp(22px, 4.4vw, 28px); }
.sec__head > span { font-size: 13px; font-weight: 500; color: var(--sage-dark); font-variant-numeric: lining-nums tabular-nums; }
.sec__rule { flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
@media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

.item {
  display: flex; gap: var(--sp-4); align-items: stretch;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
              transform var(--dur) var(--ease);
}
.item:hover { border-color: var(--sage); box-shadow: 0 6px 20px rgba(90,102,68,.09); transform: translateY(-2px); }

.item__media { flex: none; width: 88px; aspect-ratio: 1; border-radius: var(--r-md); overflow: hidden; background: var(--paper-2); }
.item__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 600ms var(--ease); }
.item:hover .item__media img { transform: scale(1.06); }

/* No photo on file: the brand green with a cup, not a grey box. */
.item__media--none {
  display: grid; place-items: center;
  background: linear-gradient(160deg, var(--sage) 0%, var(--sage-deep) 100%);
  color: var(--cream);
}

.item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item__name { font-size: 16px; font-weight: 700; line-height: 1.4; }
.item__desc {
  font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item__foot { margin-top: auto; padding-top: var(--sp-2); display: flex; align-items: baseline; gap: var(--sp-3); }
.item__price { font-size: 18px; font-weight: 700; color: var(--sage-dark); font-variant-numeric: lining-nums tabular-nums; }
.item__price small { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-inline-start: 3px; }
.item__cal { font-size: 11.5px; font-weight: 300; color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }

.foot-menu {
  background: var(--sage-deep); color: rgba(243,238,198,.72);
  padding-block: var(--sp-7); margin-block-start: var(--sp-7);
  text-align: center;
}
.foot-menu img { width: 108px; margin-inline: auto; margin-block-end: var(--sp-4); }
.foot-menu p { font-size: 13px; font-weight: 300; }
.foot-menu .btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 46px; padding: 0 var(--sp-6); margin-block-start: var(--sp-5);
  background: var(--cream); color: var(--sage-ink);
  border-radius: var(--r-full); font-size: 15px; font-weight: 500;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.foot-menu .btn:hover { background: var(--cream-soft); transform: translateY(-2px); }
.foot-menu__note { margin-block-start: var(--sp-5); font-size: 11.5px; color: rgba(243,238,198,.5); }

.rv { opacity: 0; transform: translateY(16px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.rv.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .rise { animation: none; opacity: 1; transform: none; }
  .rv { opacity: 1; transform: none; transition: none; }
  .view.is-on { animation: none; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .row:hover, .item:hover { transform: none; }
  .item:hover .item__media img { transform: none; }
}
</style>
</head>

<body>

<!-- ═══════════ VIEW 1 — LINKS ═══════════ -->
<div class="view links-view is-on" id="view-links">
  <main class="wrap--narrow">
    <header class="top">
      <img class="logo rise" src="assets/logo-mark.webp" alt="قهوة رهم" width="168" height="93" style="animation-delay:.05s">
      <h1 class="name rise" style="animation-delay:.12s">قهوة رهم</h1>
      <p class="name-en rise" style="animation-delay:.16s">RAHAM COFFEE</p>

      <div class="meta rise" style="animation-delay:.22s">
        <!--@META@-->
      </div>
    </header>

    <nav class="links" aria-label="روابط قهوة رهم">
      <!--@LINKS@-->
    </nav>
  </main>

  <footer class="foot-links">
    <p>قهوة رهم · الخبر</p>
    <p><span dir="ltr">© <span class="yr">2026</span> Raham Coffee</span></p>
  </footer>
</div>

<!-- ═══════════ VIEW 2 — MENU ═══════════ -->
<div class="view menu-view" id="menu">
  <header class="hdr">
    <div class="wrap hdr__in">
      <a class="hdr__logo" href="#">
        <img src="assets/logo.webp" alt="قهوة رهم" width="60" height="34">
        <b>قهوة رهم</b>
      </a>
      <a class="back" href="#">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        العودة
      </a>
    </div>
  </header>

  <main>
    <section class="wrap hero">
      <img class="hero__mark" src="assets/logo.webp" alt="قهوة رهم" width="128" height="71">
      <h1>المنيو</h1>
      <p>@N_ITEMS@ صنفاً — الأسعار بالريال السعودي.</p>
    </section>

    <nav class="jump" aria-label="أقسام المنيو">
      <div class="wrap jump__in">
        <!--@JUMP@-->
      </div>
    </nav>

    <div class="wrap">
      <!--@SECTIONS@-->
    </div>
  </main>

  <footer class="foot-menu">
    <img src="assets/logo-mark.webp" alt="قهوة رهم" width="108" height="60">
    <p>قهوة رهم · الخبر</p>
    <a class="btn" href="@DELIVERY@" target="_blank" rel="noopener">
      اطلب توصيل
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17V6a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v11h13Z"/><path d="M14 9h3.5a1 1 0 0 1 .8.4l2.5 3.3a1 1 0 0 1 .2.6V17h-7V9Z"/><circle cx="6" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/></svg>
    </a>
    <p class="foot-menu__note">الأسعار كما هي معروضة في قائمة التوصيل وقد تتغيّر.</p>
  </footer>
</div>

<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  [].forEach.call(document.querySelectorAll('.yr'), function (el) {
    el.textContent = new Date().getFullYear();
  });

  var views = { links: document.getElementById('view-links'),
                menu:  document.getElementById('menu') };
  var tc = document.getElementById('tc');
  var revealed = false;

  /* The hash is the whole router: "#menu" opens the menu, anything else is
     the links view. Section anchors inside the menu (#المشروبات) must not be
     mistaken for it, so only an exact "#menu" switches. */
  function show(name, push) {
    var isMenu = name === 'menu';
    views.links.classList.toggle('is-on', !isMenu);
    views.menu.classList.toggle('is-on', isMenu);
    document.body.classList.toggle('on-menu', isMenu);
    tc.setAttribute('content', isMenu ? '#FBF8EC' : '#7C8A5F');
    document.title = isMenu ? 'منيو قهوة رهم — Raham Coffee' : 'قهوة رهم — Raham Coffee';

    if (push) {
      history.pushState(null, '', isMenu ? '#menu' : location.pathname + location.search);
    }
    window.scrollTo(0, 0);
    if (isMenu) reveal();
  }

  function fromHash() {
    var h = location.hash;
    if (h === '#menu') return show('menu', false);
    if (!h) return show('links', false);
    // Any other hash is a section anchor inside the menu. Open the menu if it
    // names one (a shared deep link), and otherwise leave the view alone —
    // re-routing here is what used to bounce a category tap back to the links.
    if (views.menu.querySelector(CSS.escape ? '#' + CSS.escape(h.slice(1)) : h)) {
      if (!views.menu.classList.contains('is-on')) show('menu', false);
    }
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest('a[href="#menu"], a[href="#"]');
    if (!a) return;
    e.preventDefault();
    show(a.getAttribute('href') === '#menu' ? 'menu' : 'links', true);
  });

  addEventListener('popstate', fromHash);
  fromHash();

  /* Menu cards reveal on scroll — but only once the menu has been opened,
     or the observer fires against a hidden view and everything is already
     "revealed" by the time it is seen. */
  function reveal() {
    if (revealed) return;
    revealed = true;
    var rv = [].slice.call(views.menu.querySelectorAll('.rv'));
    if (reduce || !('IntersectionObserver' in window)) {
      rv.forEach(function (el) { el.classList.add('is-in'); });
      return;
    }
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e, i) {
        if (!e.isIntersecting) return;
        var el = e.target;
        setTimeout(function () { el.classList.add('is-in'); }, Math.min(i, 6) * 55);
        io.unobserve(el);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    rv.forEach(function (el) { io.observe(el); });

    var links = [].slice.call(views.menu.querySelectorAll('.jump a'));
    var secs = links.map(function (a) { return views.menu.querySelector(a.getAttribute('href')); });
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var i = secs.indexOf(e.target);
        links.forEach(function (a, j) { a.classList.toggle('is-active', i === j); });
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    secs.forEach(function (s) { if (s) spy.observe(s); });
  }
})();
</script>
</body>
</html>
