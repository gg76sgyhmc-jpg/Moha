/* ══════════════════════════════════════════════════════════════
   Raham Coffee — tokens

   The palette is lifted from the café's own material: --sage is the
   exact green behind the logo's calligraphy (#A3AE84, 70% of the logo
   file's pixels), --cream is the ink of that calligraphy (#F3EEC6),
   and the browns are quantised from their cup photograph. The links
   page runs cream-on-sage, which is the logo's own figure/ground.
   ══════════════════════════════════════════════════════════════ */
:root {
  --sage:        #A3AE84;
  --sage-deep:   #7C8A5F;
  --sage-dark:   #5A6644;
  --sage-ink:    #3A4230;

  --cream:       #F3EEC6;
  --cream-soft:  #FBF8EC;

  --coffee:      #4F3629;
  --coffee-mid:  #8E705E;
  --taupe:       #C5AC9D;

  --ff: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --dur: 240ms;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--ff);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.7;
  color: var(--cream);
  /* A soft wash so the flat green reads as a lit surface. Sized to the whole
     body rather than fixed to the viewport: fixed attachment stops at the fold
     on over-scroll and is a known repaint cost on mobile Safari. */
  background-color: var(--sage-deep);
  background-image:
    radial-gradient(120% 70% at 50% -10%, var(--sage) 0%, var(--sage-deep) 52%, var(--sage-dark) 100%);
  background-repeat: no-repeat;
  background-size: 100% 100%;
  -webkit-font-smoothing: antialiased;
  display: flex;
  flex-direction: column;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
h1, h2 { margin: 0; font-weight: 700; line-height: 1.3; }
p { margin: 0; }

:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; border-radius: 6px; }

.wrap { width: min(100% - 36px, 520px); margin-inline: auto; }

/* ═══════════ HEAD ═══════════ */
.top { padding-block: var(--sp-8) var(--sp-6); text-align: center; }

.logo {
  width: 168px; margin-inline: auto; margin-block-end: var(--sp-5);
  filter: drop-shadow(0 6px 18px rgba(58,66,48,.32));
}

.name {
  font-size: clamp(26px, 6.4vw, 34px);
  letter-spacing: -.01em;
}
.name-en {
  margin-top: var(--sp-2);
  font-size: 12px; font-weight: 500;
  letter-spacing: .34em;
  padding-inline-start: .34em;   /* offsets the trailing track, keeps it centred */
  direction: ltr;
  color: rgba(243,238,198,.62);
}

.meta {
  margin-top: var(--sp-5);
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: var(--sp-2) var(--sp-3);
}
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid rgba(243,238,198,.26);
  border-radius: var(--r-full);
  padding: 6px 14px;
  font-size: 13px; font-weight: 300;
  color: rgba(243,238,198,.9);
}
.pill svg { flex: none; opacity: .85; }
.pill b { font-weight: 500; font-variant-numeric: lining-nums tabular-nums; }

/* ═══════════ LINKS ═══════════ */
.links {
  display: flex; flex-direction: column; gap: var(--sp-3);
  padding-block-end: var(--sp-7);
}

.row {
  display: flex; align-items: center; gap: var(--sp-4);
  min-height: 72px;
  padding: var(--sp-3) var(--sp-4);
  background: rgba(251,248,236,.1);
  border: 1px solid rgba(243,238,198,.2);
  border-radius: var(--r-lg);
  backdrop-filter: blur(6px);
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
              transform var(--dur) var(--ease);
}
.row:hover, .row:focus-visible {
  background: rgba(251,248,236,.17);
  border-color: rgba(243,238,198,.42);
  transform: translateY(-2px);
}
.row:active { transform: translateY(0); }

/* The menu is the reason most people open this page, so it is the one
   filled row rather than one more outline among six. */
.row--featured {
  background: var(--cream);
  border-color: var(--cream);
  color: var(--sage-ink);
}
.row--featured:hover, .row--featured:focus-visible {
  background: var(--cream-soft);
  border-color: var(--cream-soft);
}
.row--featured .row__ic { background: rgba(58,66,48,.1); color: var(--sage-ink); }
.row--featured .row__sub { color: rgba(58,66,48,.66); }
.row--featured .row__go { color: rgba(58,66,48,.5); }

.row__ic {
  flex: none;
  width: 46px; height: 46px; border-radius: var(--r-md);
  background: rgba(243,238,198,.14);
  display: grid; place-items: center;
  color: var(--cream);
}
.row__txt { flex: 1; min-width: 0; }
.row__label { display: block; font-size: 16.5px; font-weight: 500; line-height: 1.35; }
.row__sub {
  display: block;
  font-size: 13px; font-weight: 300; color: rgba(243,238,198,.62);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.row__go { flex: none; color: rgba(243,238,198,.45); transition: transform var(--dur) var(--ease); }
.row:hover .row__go { transform: translateX(-4px); }   /* RTL: forward is leftward */

/* ═══════════ FOOT ═══════════ */
.foot {
  margin-top: auto;
  padding-block: var(--sp-5) var(--sp-6);
  text-align: center;
  font-size: 12px; font-weight: 300;
  color: rgba(243,238,198,.45);
}
.foot p + p { margin-top: 4px; }

/* ═══════════ ENTRANCE ═══════════ */
.rise { opacity: 0; transform: translateY(14px); animation: rise .6s var(--ease) forwards; }
@keyframes rise { to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .rise { animation: none; opacity: 1; transform: none; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .row:hover { transform: none; }
}
