<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منيو قهوة رهم — Raham Coffee</title>
<meta name="description" content="منيو قهوة رهم: المشروبات والحلويات بالأسعار — الخبر.">
<meta name="theme-color" content="#FBF8EC">
<meta property="og:title" content="منيو قهوة رهم">
<meta property="og:type" content="website">
<style>
/*@FONTS@*/

/* ══════════════════════════════════════════════════════════════
   Raham Coffee — menu

   Same tokens as the links page. The menu inverts the ground: cream
   paper with sage as the accent, because a page of food photographs
   and prices needs the quieter surface to do the reading.
   ══════════════════════════════════════════════════════════════ */
:root {
  --sage:        #A3AE84;
  --sage-deep:   #7C8A5F;
  --sage-dark:   #5A6644;
  --sage-ink:    #3A4230;

  --cream:       #F3EEC6;
  --paper:       #FBF8EC;
  --paper-2:     #F4EFDF;

  --coffee:      #4F3629;
  --coffee-mid:  #8E705E;
  --taupe:       #C5AC9D;

  --ink:         #2A2620;
  --ink-2:       #5C544A;
  --muted:       #8B8175;
  --line:        #E6DFC9;

  --ff: 'IBM Plex Sans Arabic', system-ui, -apple-system, sans-serif;

  --sp-1: 4px;  --sp-2: 8px;  --sp-3: 12px; --sp-4: 16px;
  --sp-5: 24px; --sp-6: 32px; --sp-7: 48px; --sp-8: 64px;

  --r-md: 14px; --r-lg: 20px; --r-xl: 28px; --r-full: 999px;
  --ease: cubic-bezier(.22,.61,.36,1);
  --dur: 240ms;
  --head-h: 60px;
}

*, *::before, *::after { box-sizing: border-box; }

html { scroll-behavior: smooth; scroll-padding-top: calc(var(--head-h) + 58px); }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body {
  margin: 0;
  font-family: var(--ff);
  font-weight: 300;
  font-size: 16px;
  line-height: 1.7;
  color: var(--ink-2);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
h1, h2, h3 { margin: 0; font-weight: 700; line-height: 1.3; color: var(--ink); }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible { outline: 2px solid var(--sage-deep); outline-offset: 3px; border-radius: 6px; }

.wrap { width: min(100% - 36px, 900px); margin-inline: auto; }

/* ═══════════ HEADER ═══════════ */
.hdr {
  position: sticky; inset-block-start: 0; z-index: 40;
  height: var(--head-h);
  display: flex; align-items: center;
  background: rgba(251,248,236,.9);
  backdrop-filter: blur(12px) saturate(1.3);
  border-block-end: 1px solid var(--line);
}
.hdr__in { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-4); }
.hdr__logo { display: flex; align-items: center; gap: var(--sp-3); }
.hdr__logo img { height: 34px; width: auto; border-radius: 7px; }
.hdr__logo b { font-size: 15px; font-weight: 700; color: var(--ink); }

.back {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 40px; padding: 0 var(--sp-4);
  border: 1px solid var(--line); border-radius: var(--r-full);
  font-size: 13.5px; font-weight: 500; color: var(--sage-dark);
  background: transparent;
  transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.back:hover { background: var(--paper-2); border-color: var(--sage); }

/* ═══════════ HERO ═══════════ */
.hero {
  padding-block: var(--sp-7) var(--sp-6);
  text-align: center;
}
.hero__mark { width: 128px; margin-inline: auto; margin-block-end: var(--sp-4); border-radius: 12px; }
.hero h1 { font-size: clamp(28px, 6vw, 40px); letter-spacing: -.01em; }
.hero p {
  margin-top: var(--sp-3); font-size: 15px; color: var(--muted);
  max-width: 46ch; margin-inline: auto;
}

/* ═══════════ CATEGORY NAV ═══════════ */
.jump {
  position: sticky; inset-block-start: var(--head-h); z-index: 30;
  background: rgba(251,248,236,.92);
  backdrop-filter: blur(12px);
  border-block-end: 1px solid var(--line);
  padding-block: var(--sp-3);
}
.jump__in { display: flex; gap: var(--sp-2); overflow-x: auto; scrollbar-width: none; }
.jump__in::-webkit-scrollbar { display: none; }
.jump a {
  flex: none;
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 42px; padding: 0 var(--sp-5);
  border: 1px solid var(--line); border-radius: var(--r-full);
  font-size: 14.5px; font-weight: 500; color: var(--ink-2);
  background: var(--paper);
  white-space: nowrap;
  transition: background var(--dur) var(--ease), color var(--dur) var(--ease),
              border-color var(--dur) var(--ease);
}
.jump a:hover, .jump a.is-active {
  background: var(--sage-deep); border-color: var(--sage-deep); color: var(--paper);
}
.jump a span {
  font-size: 12px; opacity: .66;
  font-variant-numeric: lining-nums tabular-nums;
}

/* ═══════════ SECTIONS ═══════════ */
.sec { padding-block: var(--sp-7); }
.sec + .sec { border-block-start: 1px solid var(--line); }

.sec__head { display: flex; align-items: baseline; gap: var(--sp-3); margin-block-end: var(--sp-5); }
.sec__head h2 { font-size: clamp(22px, 4.4vw, 28px); }
.sec__head span {
  font-size: 13px; font-weight: 500; color: var(--sage-dark);
  font-variant-numeric: lining-nums tabular-nums;
}
.sec__rule { flex: 1; height: 1px; background: var(--line); }

.grid { display: grid; gap: var(--sp-4); grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
@media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

/* ═══════════ ITEM ═══════════ */
.item {
  display: flex; gap: var(--sp-4); align-items: stretch;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  transition: border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease),
              transform var(--dur) var(--ease);
}
.item:hover {
  border-color: var(--sage);
  box-shadow: 0 6px 20px rgba(90,102,68,.09);
  transform: translateY(-2px);
}

.item__media {
  flex: none; width: 88px; aspect-ratio: 1; border-radius: var(--r-md);
  overflow: hidden; background: var(--paper-2);
}
.item__media img { width: 100%; height: 100%; object-fit: cover; transition: transform 600ms var(--ease); }
.item:hover .item__media img { transform: scale(1.06); }

/* No photo on file: a cup mark in the brand green rather than a grey box. */
.item__media--none {
  display: grid; place-items: center;
  background: linear-gradient(160deg, var(--sage) 0%, var(--sage-deep) 100%);
  color: var(--cream);
}

.item__body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item__name { font-size: 16px; font-weight: 700; line-height: 1.4; }
.item__desc {
  font-size: 13px; font-weight: 300; color: var(--muted); line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.item__foot { margin-top: auto; padding-top: var(--sp-2); display: flex; align-items: baseline; gap: var(--sp-3); }
.item__price {
  font-size: 18px; font-weight: 700; color: var(--sage-dark);
  font-variant-numeric: lining-nums tabular-nums;
}
.item__price small { font-size: 11.5px; font-weight: 500; color: var(--muted); margin-inline-start: 3px; }
.item__cal {
  font-size: 11.5px; font-weight: 300; color: var(--muted);
  font-variant-numeric: lining-nums tabular-nums;
}

/* ═══════════ FOOT ═══════════ */
.foot {
  background: var(--sage-deep); color: rgba(243,238,198,.72);
  padding-block: var(--sp-7); margin-block-start: var(--sp-7);
  text-align: center;
}
.foot img { width: 108px; margin-inline: auto; margin-block-end: var(--sp-4); }
.foot p { font-size: 13px; font-weight: 300; }
.foot .btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  min-height: 46px; padding: 0 var(--sp-6); margin-block-start: var(--sp-5);
  background: var(--cream); color: var(--sage-ink);
  border-radius: var(--r-full); font-size: 15px; font-weight: 500;
  transition: transform var(--dur) var(--ease), background var(--dur) var(--ease);
}
.foot .btn:hover { background: #FBF8EC; transform: translateY(-2px); }
.foot__note { margin-block-start: var(--sp-5); font-size: 11.5px; color: rgba(243,238,198,.5); }

/* ═══════════ REVEAL ═══════════ */
.rv { opacity: 0; transform: translateY(16px); transition: opacity .6s var(--ease), transform .6s var(--ease); }
.rv.is-in { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  .rv { opacity: 1; transform: none; transition: none; }
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  .item:hover { transform: none; }
  .item:hover .item__media img { transform: none; }
}
</style>
</head>

<body>

<header class="hdr">
  <div class="wrap hdr__in">
    <a class="hdr__logo" href="index.html">
      <img src="assets/logo.webp" alt="قهوة رهم" width="60" height="34">
      <b>قهوة رهم</b>
    </a>
    <a class="back" href="index.html">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      كل الروابط
    </a>
  </div>
</header>

<main>
  <section class="wrap hero">
    <img class="hero__mark" src="assets/logo.webp" alt="قهوة رهم" width="128" height="71">
    <h1>المنيو</h1>
    <p>@N_ITEMS@ صنفاً — الأسعار بالريال السعودي.</p>
  </section>

  <nav class="jump" aria-label="أقسام المنيو">
    <div class="wrap jump__in">
      <!--@JUMP@-->
    </div>
  </nav>

  <div class="wrap">
    <!--@SECTIONS@-->
  </div>
</main>

<footer class="foot">
  <img src="assets/logo-mark.webp" alt="قهوة رهم" width="108" height="60">
  <p>قهوة رهم · الخبر</p>
  <a class="btn" href="@DELIVERY@" target="_blank" rel="noopener">
    اطلب توصيل
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 17V6a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v11h13Z"/><path d="M14 9h3.5a1 1 0 0 1 .8.4l2.5 3.3a1 1 0 0 1 .2.6V17h-7V9Z"/><circle cx="6" cy="18.5" r="2"/><circle cx="17.5" cy="18.5" r="2"/></svg>
  </a>
  <p class="foot__note">الأسعار كما هي معروضة في قائمة التوصيل وقد تتغيّر.</p>
</footer>

<script>
(function () {
  'use strict';
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Reveal on scroll */
  var rv = [].slice.call(document.querySelectorAll('.rv'));
  if (reduce || !('IntersectionObserver' in window)) {
    rv.forEach(function (el) { el.classList.add('is-in'); });
  } else {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (e, i) {
        if (!e.isIntersecting) return;
        var el = e.target;
        setTimeout(function () { el.classList.add('is-in'); }, Math.min(i, 6) * 55);
        io.unobserve(el);
      });
    }, { rootMargin: '0px 0px -6% 0px', threshold: 0.05 });
    rv.forEach(function (el) { io.observe(el); });
  }

  /* Mark the category the reader is currently inside. */
  var links = [].slice.call(document.querySelectorAll('.jump a'));
  var secs = links.map(function (a) { return document.querySelector(a.getAttribute('href')); });
  if ('IntersectionObserver' in window) {
    var spy = new IntersectionObserver(function (es) {
      es.forEach(function (e) {
        if (!e.isIntersecting) return;
        var i = secs.indexOf(e.target);
        links.forEach(function (a, j) { a.classList.toggle('is-active', i === j); });
      });
    }, { rootMargin: '-30% 0px -60% 0px' });
    secs.forEach(function (s) { if (s) spy.observe(s); });
  }
})();
</script>
</body>
</html>
